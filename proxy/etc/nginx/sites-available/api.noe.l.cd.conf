# api.noe.l.cd — Noesphere gateway (OpenAI + Anthropic compatible)
# SSE: buffering must stay off, otherwise answers arrive in bursts.

server {

    # present a provider-plausible Server header (nginx would otherwise announce itself)
    more_set_headers "Server: cloudflare";
    listen 80;
    listen [::]:80;
    server_name api.noe.l.cd;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://api.noe.l.cd$request_uri; }
}

server {

    # present a provider-plausible Server header (nginx would otherwise announce itself)
    more_set_headers "Server: cloudflare";
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.noe.l.cd;

    ssl_certificate     /etc/ssl/certs/noe.l.cd.fullchain.pem;
    ssl_certificate_key /etc/ssl/private/noe.l.cd.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    server_tokens off;

    client_max_body_size 128m;
    client_body_timeout 600s;
    gzip off;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 60s;
        proxy_send_timeout   1800s;
        proxy_read_timeout   1800s;

        add_header X-Accel-Buffering no always;
    }
}
